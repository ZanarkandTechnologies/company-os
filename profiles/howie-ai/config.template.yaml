# Hermes memory is deliberately small and contains only durable preferences and
# operating conventions. Canonical work state remains filesystem tickets.
memory:
  memory_enabled: true
  user_profile_enabled: true
  memory_char_limit: 2200
  user_char_limit: 1375
  write_approval: true

agent:
  disabled_toolsets:
    - browser
    - code_execution
    - computer_use
    - cronjob
    - delegation
    - kanban
    - messaging
    - session_search
    - terminal
    - web

# Source-owned user platform plugin. It runs its aiohttp listener inside the
# existing Hermes gateway process; the listener stays loopback-only and must be
# exposed through an operator-owned HTTPS reverse proxy or tunnel.
plugins:
  enabled:
    - notion-platform

gateway:
  platforms:
    notion:
      enabled: true
      gateway_restart_notification: false
      typing_indicator: false
      extra:
        host: 127.0.0.1
        port: 8645
        path: /notion/webhook
        event_types:
          - page.created
          - page.content_updated
          - page.properties_updated
          - page.deleted
          - page.undeleted

# The Telegram list is complete, not additive. It intentionally exposes only
# native file editing, this profile's skill, and the filtered official Drive
# MCP. No terminal, browser, web, cron, delegation, messaging, Kanban, or other
# MCP toolset is available to a Telegram turn.
platform_toolsets:
  telegram:
    - file
    - skills
    - mcp-googledrive
  notion:
    - skills
    - notion_connector

# Google Drive rejects dynamic OAuth client registration. A human operator adds
# the pre-registered client ID and secret to private profile configuration only
# after reviewing this rendered source config; do not put those values here.
mcp_servers:
  googledrive:
    url: "https://drivemcp.googleapis.com/mcp/v1"
    auth: oauth
    oauth:
      # Values resolve from the excluded private profile .env.
      client_id: "${GOOGLE_DRIVE_MCP_CLIENT_ID}"
      client_secret: "${GOOGLE_DRIVE_MCP_CLIENT_SECRET}"
      redirect_host: localhost
    tools:
      include:
        - search_files
        - read_file_content
        - get_file_metadata
        - create_file
      resources: false
      prompts: false
