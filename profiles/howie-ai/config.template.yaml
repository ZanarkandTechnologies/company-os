# Source template for the howie-ai Hermes profile. The sync script renders this
# file to config.yaml; credentials, employee-directory data, gateway state,
# pairing state, and cron jobs do not belong here.
#
# The rendered workspace root must name the dedicated Howie company workspace. The
# native file tool is permitted there by profile convention only; neither that
# working directory nor the Telegram toolset allowlist is a filesystem sandbox.

terminal:
  backend: local
  cwd: {{WORKSPACE_ROOT_YAML}}
  home_mode: profile

privacy:
  redact_pii: true

# Ticket comments must become ordered turns in one persistent session. Queue a
# follow-up that arrives while Hermes is still answering the prior comment.
display:
  busy_input_mode: queue

model:
  default: z-ai/glm-5.2
  provider: openrouter

# Hermes profiles seed a broad library by default. Howie AI is deliberately an
# operations profile: all bundled skills are disabled here so only the twenty
# source-owned packages synced below are visible in a session.
