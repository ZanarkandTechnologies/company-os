model:
  default: z-ai/glm-5.2
  provider: openrouter
  base_url: https://openrouter.ai/api/v1
  api_mode: chat_completions

terminal:
  backend: local
  cwd: .
  home_mode: profile

privacy:
  redact_pii: true

# Keep multiple comments on one Notion ticket as ordered conversational turns.
display:
  busy_input_mode: queue

memory:
  memory_enabled: true
  user_profile_enabled: true
  write_approval: true

telemetry:
  shared_metrics:
    enabled: false

plugins:
  enabled:
    - notion-platform

gateway:
  platforms:
    notion:
      enabled: true
      gateway_restart_notification: false
      typing_indicator: false
      extra:
        host: 127.0.0.1
        port: 8645
        path: /notion/webhook
        event_types:
          - comment.created

platform_toolsets:
  notion:
    - skills
    - notion_connector
